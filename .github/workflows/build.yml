
name: Build PSP Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make build-essential

      - name: Install PSPDEV
        run: |
          git clone https://github.com/pspdev/pspdev.git
          cd pspdev
          ./prepare.sh
          sudo ./build-all.sh

      - name: Compile
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH=$PSPDEV/bin:$PATH

          mkdir build
          cd build

          cmake ..
          make -j2

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: PSP-Game
          path: |
            build/**/*.PBP
            build/**/*.ELF
